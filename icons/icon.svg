<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Main Server Rack Visual -->
  <g filter="url(#shadow)">
    <!-- Server Unit 1 (Top) -->
    <rect x="96" y="104" width="320" height="76" rx="14" fill="url(#serverGrad)" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="132" cy="142" r="8" fill="#3b82f6" />
    <circle cx="160" cy="142" r="8" fill="#10b981" />
    <circle cx="188" cy="142" r="8" fill="#f59e0b" />
    <line x1="230" y1="134" x2="380" y2="134" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="230" y1="150" x2="350" y2="150" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Server Unit 2 (Middle) -->
    <rect x="96" y="200" width="320" height="76" rx="14" fill="url(#serverGrad)" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="132" cy="238" r="8" fill="#10b981" />
    <circle cx="160" cy="238" r="8" fill="#10b981" />
    <circle cx="188" cy="238" r="8" fill="#10b981" />
    <line x1="230" y1="230" x2="380" y2="230" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="230" y1="246" x2="320" y2="246" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Server Unit 3 (Bottom) -->
    <rect x="96" y="296" width="320" height="76" rx="14" fill="url(#serverGrad)" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="132" cy="334" r="8" fill="#3b82f6" />
    <circle cx="160" cy="334" r="8" fill="#10b981" />
    <circle cx="188" cy="334" r="8" fill="#64748b" />
    <line x1="230" y1="326" x2="380" y2="326" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="230" y1="342" x2="340" y2="342" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Large Audit Checkmark Badge -->
  <g filter="url(#shadow)">
    <circle cx="370" cy="370" r="76" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="8" />
    <!-- Checkmark Path -->
    <path d="M336 370 L360 394 L408 344" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title Text Subtext -->
  <text x="256" y="440" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="32" letter-spacing="3">MASERVER</text>
</svg>
